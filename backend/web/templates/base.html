<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HermesTeacher{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='6' fill='%23070c1c'/%3E%3Cline x1='5' y1='19' x2='12' y2='8' stroke='%235b9dff' stroke-width='1.4'/%3E%3Cline x1='12' y1='8' x2='21' y2='13' stroke='%235b9dff' stroke-width='1.4'/%3E%3Ccircle cx='5' cy='19' r='2.8' fill='%234f84ee'/%3E%3Ccircle cx='12' cy='8' r='2.8' fill='%236cc3ff'/%3E%3Ccircle cx='21' cy='13' r='3.4' fill='%23a4f6ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <script defer src="/static/vendor/marked.umd.js"></script>
  <script defer src="/static/vendor/purify.min.js"></script>
  <script defer src="/static/vendor/katex/katex.min.js"></script>
  {% block head %}{% endblock %}
  <script defer src="/static/app.js?v={{ asset_version }}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/" aria-label="HermesTeacher, accueil">
      <svg viewBox="0 0 26 26" aria-hidden="true">
        <line x1="5" y1="19" x2="12" y2="8" stroke="#5b9dff" stroke-width="1.2"/>
        <line x1="12" y1="8" x2="21" y2="13" stroke="#5b9dff" stroke-width="1.2"/>
        <line x1="5" y1="19" x2="21" y2="13" stroke="#5b9dff" stroke-opacity=".45" stroke-width="1.2"/>
        <circle cx="5" cy="19" r="2.6" fill="#4f84ee"/>
        <circle cx="12" cy="8" r="2.6" fill="#6cc3ff"/>
        <circle cx="21" cy="13" r="3.2" fill="#a4f6ff"/>
      </svg>
      HermesTeacher
    </a>
    <nav aria-label="Navigation principale">
      <a href="/" {% if active_page == 'home' %}aria-current="page"{% endif %}>concepts</a>
      <a href="/profile" {% if active_page == 'profile' %}aria-current="page"{% endif %}>profil</a>
    </nav>
    <a class="btn btn-primary" href="/concepts/new">Nouveau concept</a>
  </header>
  <main class="container {% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
